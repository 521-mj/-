name: Build Cracked Spear
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build jar
        run: |
          mkdir -p src_tree
          unzip -o *.zip -d src_tree
          WORK=$(find src_tree -name build.gradle | head -n 1)
          cd $(dirname $WORK)
          chmod +x ./gradlew
          if command -v gradle > /dev/null; then G=gradle; else G=./gradlew; fi
          $G build --no-daemon --stacktrace
          mkdir -p $GITHUB_WORKSPACE/out
          cp build/libs/*.jar $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: crackedspear-jar
          path: out/*.jar
          if-no-files-found: error
